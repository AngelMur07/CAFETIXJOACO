<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFETIX JOACO - PQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body>

  <header class="header">
    <div class="header-contenedor">
      <a href="index.html" class="header-marca">
        <img src="../img/logo.png" alt="Escudo Institución Educativa JJFH" class="header-logo">
        <div class="header-texto">
          <h1>CAFETIX JOACO <span class="rol-etiqueta">Cliente</span></h1>
          <p>Sistema Web de la Cafetería Institucional JJFH</p>
        </div>
      </a>
      {% include "menu.html" %}
    </div>
  </header>

  <main class="main">

    <div class="formulario-contenedor tarjeta">
      <div class="form-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 5h16v14H4z"></path>
          <path d="M8 9h8"></path>
          <path d="M8 13h5"></path>
        </svg>
      </div>
      <h2>PQR</h2>
      <p class="subtitulo-form">Peticiones, quejas, reclamos y felicitaciones</p>

      <div class="aviso-panel">
        Este formulario es visual. El mensaje no se guarda todavía.
      </div>

      {% if error %}
      <div class="aviso-panel">{{ error }}</div>
      {% endif %}

      <!-- Flask recibe el formulario y muestra un mensaje según el tipo. Todavía no se guarda en MySQL. -->
      <form action="pqr-gracias.html" method="post">
        <div class="form-grupo">
          <label for="tipo">Tipo de PQR</label>
          <select id="tipo" name="tipo" required>
            <option value="">Selecciona un tipo</option>
            <option value="peticion"{% if tipo == "peticion" %} selected{% endif %}>Petición</option>
            <option value="queja"{% if tipo == "queja" %} selected{% endif %}>Queja</option>
            <option value="reclamo"{% if tipo == "reclamo" %} selected{% endif %}>Reclamo</option>
            <option value="felicitacion"{% if tipo == "felicitacion" %} selected{% endif %}>Felicitación</option>
          </select>
        </div>

        <div class="form-grupo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" value="{{ nombre }}" required>
        </div>

        <div class="form-grupo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="Tu correo">
        </div>

        <div class="form-grupo">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" name="asunto" placeholder="Ej: Tiempo de espera">
        </div>

        <div class="form-grupo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" required>{{ mensaje_pqr }}</textarea>
        </div>

        <button type="submit" class="btn btn-verde form-boton">
          Enviar
        </button>
      </form>
    </div>

  </main>

{% include "pie.html" %}

</body>
</html>
