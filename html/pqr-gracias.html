<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFETIX JOACO - PQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body>

  <header class="header">
    <div class="header-contenedor">
      <a href="index.html" class="header-marca">
        <img src="../img/logo.png" alt="Escudo Institución Educativa JJFH" class="header-logo">
        <div class="header-texto">
          <h1>CAFETIX JOACO</h1>
          <p>Sistema Web de la Cafetería Institucional JJFH</p>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
      </nav>
    </div>
  </header>

  <main class="main">

    <div class="formulario-contenedor tarjeta">
      <div class="form-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8 12l3 3 5-6"></path>
        </svg>
      </div>
      <h2>PQR enviada</h2>
      <p class="subtitulo-form">{{ mensaje }}</p>
      <a href="index.html" class="btn btn-verde form-boton">Cerrar</a>
    </div>

  </main>

  <footer class="footer">
    <div class="acento-linea"></div>
    <p class="footer-nombre">CAFETIX JOACO</p>
    <p>Cafetería Institucional JJFH</p>
    <p>Institución Educativa José Joaquín Flórez Hernández</p>
    <p>Ibagué - Tolima</p>
    <nav class="footer-nav">
      <a href="index.html">Inicio</a>
    </nav>
  </footer>

</body>
</html>
