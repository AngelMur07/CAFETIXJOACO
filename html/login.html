<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFETIX JOACO - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-contenedor">
      <a href="index.html" class="header-marca">
        <span class="header-logo-caja">
          <img src="../img/logo.png" alt="Logo Institución Educativa JJFH" class="header-logo">
        </span>
        <div class="header-texto">
          <h1>CAFETIX JOACO</h1>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="pedido.html">Mi Pedido</a>
        <a href="turno.html">Mi Turno</a>
        <a href="login.html" class="btn-sesion activo">Iniciar Sesión</a>
        <a href="registro.html" class="btn-registro">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="main">

    <div class="formulario-contenedor tarjeta">
      <div class="form-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
      </div>
      <h2>Iniciar Sesión</h2>
      <p class="subtitulo-form">Ingresa con tu usuario registrado</p>

      <!-- Formulario visual (sin funcionalidad) -->
      <form action="#" method="post">
        <div class="form-grupo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario">
        </div>

        <div class="form-grupo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Escribe tu contraseña">
        </div>

        <button type="button" class="btn btn-verde form-boton">Ingresar</button>
      </form>

      <p class="form-enlace">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </div>

  </main>

  <footer class="footer">
    <div class="acento-linea"></div>
    <p class="footer-nombre">CAFETIX JOACO</p>
    <p>Cafetería Institucional JJFH</p>
    <p>Institución Educativa José Joaquín Flórez Hernández</p>
    <p>Ibagué - Tolima</p>
    <p class="footer-enlace"><a href="panel.html">Panel de cafetería</a></p>
  </footer>

</body>
</html>
