<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <title>CAFETIX JOACO - Gracias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body class="gracias-page">

  <header class="header">
    <div class="header-contenedor">
      <a href="index.html" class="header-marca">
        <img src="../img/logo.png" alt="Escudo Institución Educativa JJFH" class="header-logo">
        <div class="header-texto">
          <h1>CAFETIX JOACO</h1>
        </div>
        {% if sesion_iniciada and nombre_usuario %}
        <span class="header-divisor" aria-hidden="true"></span>
        <span class="header-saludo">👋 Hola, {{ nombre_usuario.split()[0] }}</span>
        {% endif %}
      </a>
      {% include "menu.html" %}
      {% include "indicador-turno.html" %}
    </div>
  </header>

  <main class="main">

    <div class="formulario-contenedor tarjeta">
      <div class="form-icono" aria-hidden="true">
        <img src="../img/iconos/encuesta.svg" alt="" class="icono icono-tarjeta">
      </div>
      <h2>¡Gracias por tu opinión!</h2>
      <p class="subtitulo-form">Tu respuesta nos ayuda a mejorar nuestro servicio.</p>
      <a href="index.html" class="btn btn-verde form-boton">Cerrar</a>
    </div>

  </main>

{% include "pie.html" %}

</body>
</html>
